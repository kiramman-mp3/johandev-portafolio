<section class="featured-projects-section" id="proyectos-destacados">
  <div class="projects-container">
    <div class="section-header home-section-header">
      <h2 class="section-title">Proyectos</h2>
    </div>

    <div class="projects-grid">
      <div *ngFor="let project of featuredProjects" class="project-card">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title" />
        </div>
        <div class="project-content">
          <div class="project-header">
            <h3 class="project-title">{{ project.title }}</h3>
            <div class="project-badge" [ngClass]="getStatusBadgeClass(project.status)">
              <i class="fas" [ngClass]="getStatusIcon(project.status)"></i>
              <span>{{ getStatusText(project.status) }}</span>
            </div>
          </div>
          <p class="project-description">{{ project.shortDescription }}</p>
          <div class="project-footer">
            <div class="project-tech">
              <span *ngFor="let tech of project.technologies.slice(0, 3)" class="tech-tag">
                {{ tech }}
              </span>
            </div>
          </div>
          <div class="project-links">
            <a [routerLink]="['/proyectos', project.id]">Detalles</a>
            <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-github" aria-hidden="true"></i> Código
            </a>
            <a *ngIf="project.webUrl" [href]="project.webUrl" target="_blank" rel="noopener noreferrer">
              <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i> Demo
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- View All Button -->
    <div class="view-all-container">
      <a routerLink="/proyectos" class="btn-view-all">
        Ver todos los proyectos
      </a>
    </div>
  </div>
</section>
