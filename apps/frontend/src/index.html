<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>JohanDev</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/Novacore-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/img/Novacore-icon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/Novacore-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/Novacore-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/Novacore-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <!-- Aplica el tema guardado antes del primer pintado: el HTML prerenderizado siempre sale en oscuro -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-theme');
      } catch (e) {}
    })();
    // Intro del cielo: sale en cada carga, salvo con movimiento reducido.
    // intro-active bloquea el scroll; se retira sola a los 9 s por si Angular no arranca.
    (function () {
      var root = document.documentElement;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) {
        root.classList.add('skip-intro');
      } else {
        root.classList.add('intro-active');
        setTimeout(function () { root.classList.remove('intro-active'); }, 9000);
      }
    })();
  </script>
  <style>
    html {
      background-color: #0c1310;
    }

    html.light-theme {
      background-color: #e9f0ec;
    }

    html.intro-active {
      overflow: hidden;
    }
  </style>
</head>

<body>
  <app-root></app-root>
</body>

</html>
