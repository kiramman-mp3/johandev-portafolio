<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>JohanDev</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/Novacore-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/img/Novacore-icon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/Novacore-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/Novacore-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/Novacore-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <!-- Aplica el tema guardado antes del primer pintado: el HTML prerenderizado siempre sale en oscuro -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var light = saved ? saved === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (light) document.documentElement.classList.add('light-theme');
      } catch (e) {}
    })();
  </script>
  <style>
    html,
    body {
      background-color: #15171a;
    }

    html.light-theme,
    html.light-theme body {
      background-color: #f4f5f4;
    }
  </style>
</head>

<body>
  <app-root></app-root>
</body>

</html>
